# Web UI workspace.
#
# - `app/`: the Leptos UI, compiled to wasm32-unknown-unknown.
# - `xtask/`: native build helper. `cargo xtask` (alias in .cargo/config.toml) builds
#   `app` and bundles it into a single self-contained HTML file: dist/six-dof.html.
# - `mockgen/`: native test helper. Generates the data for the fake serial port used to
#   test the UI without hardware (see test/README.md).
[workspace]
resolver = "3"
members = ["app", "xtask", "mockgen"]

[workspace.dependencies]
# David's fork: v0.12.1 + embassy-executor 0.10 support (TODO 1.4).
# Keep this rev identical in common/, firmware/ and web/ (here).
postcard-rpc = { git = "https://github.com/david-boles/postcard-rpc", rev = "301d1384d1612a90fb3a6f3ea188d326f80a574b" }
# wasm-bindgen's JS glue generator (`wasm-bindgen-cli-support`, used by xtask) must be
# exactly the same version as the `wasm-bindgen` crate the app is compiled against.
# web-sys/js-sys pin it exactly too, so bump all of these together.
wasm-bindgen = "=0.2.130"
wasm-bindgen-cli-support = "=0.2.130"

[profile.release]
# Smaller wasm (Leptos' recommended settings for size).
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
