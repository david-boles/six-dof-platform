[package]
name = "six-dof-platform-web"
version = "0.1.0"
edition = "2024"
description = "Browser UI for the six-DOF test stand (Leptos, Web Serial)"

[dependencies]
six-dof-platform-common = { path = "../../common", features = ["use-std"] }
# Version: see web/Cargo.toml. `cobs` enables the COBS frame accumulator used by our
# Web Serial wire.
postcard-rpc = { workspace = true, features = ["use-std", "cobs"] }
cobs = { version = "0.4", default-features = false, features = ["alloc"] }

leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Navigator",
    "Window",
    "Serial",
    "SerialPort",
    "SerialOptions",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "WritableStream",
    "WritableStreamDefaultWriter",
    # Calibration storage (storage.rs): localStorage, JSON file download/upload.
    "Storage",
    "Document",
    "Node",
    "Element",
    "EventTarget",
    "HtmlElement",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "File",
    "FileList",
    "Blob",
    "BlobPropertyBag",
    "Url",
    # 3D view (view3d.rs).
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
    "MouseEvent",
    "WheelEvent",
] }
# 3D view: three-d's renderer on a WebGL2 context we create ourselves from the
# canvas (so no `window` feature, which would bring winit). three-d 0.19 uses glow
# 0.17; keep them matched.
three-d = { version = "0.19", default-features = false }
glow = "0.17"
# Saved calibration and reference point as JSON (storage.rs).
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = "0.1"
thiserror = "2"
