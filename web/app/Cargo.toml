[package]
name = "six-dof-platform-web"
version = "0.1.0"
edition = "2024"
description = "Browser UI for the six-DOF test stand (Leptos, Web Serial)"

[dependencies]
six-dof-platform-common = { path = "../../common", features = ["use-std"] }
# Version: see web/Cargo.toml. `cobs` enables the COBS frame accumulator used by our
# Web Serial wire.
postcard-rpc = { workspace = true, features = ["use-std", "cobs"] }
cobs = { version = "0.4", default-features = false, features = ["alloc"] }

leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Navigator",
    "Window",
    "Serial",
    "SerialPort",
    "SerialOptions",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "WritableStream",
    "WritableStreamDefaultWriter",
] }
console_error_panic_hook = "0.1"
thiserror = "2"
