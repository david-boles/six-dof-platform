[package]
name = "six-dof-platform-mockgen"
version = "0.1.0"
edition = "2024"
description = "Generates device messages for the fake serial port used to test the web UI without hardware"
publish = false

[dependencies]
six-dof-platform-common = { path = "../../common", features = ["use-std"] }
# Version: see web/Cargo.toml.
postcard-rpc = { workspace = true, features = ["use-std"] }
postcard = { version = "1.1", features = ["use-std"] }
serde = "1.0"
cobs = { version = "0.4", features = ["alloc"] }
