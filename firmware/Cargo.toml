[package]
edition = "2024"
name = "six-dof-platform-firmware"
rust-version = "1.98"
version = "0.1.0"

[[bin]]
name = "six-dof-platform-firmware"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["defmt", "esp32c6", "unstable"] }

esp-rtos = { version = "0.4.0", features = ["defmt", "embassy", "esp32c6"] }

defmt = "1.0.1"
esp-bootloader-esp-idf = { version = "0.6.0", features = ["defmt", "esp32c6"] }

embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt"] }
panic-rtt-target = { version = "0.2.0", features = ["defmt"] }
rtt-target = { version = "0.6.2", features = ["defmt"] }

critical-section = "1.2.0"
static_cell = "2.1.1"
bitfield-struct = "0.13.0"
endian-num = "0.2.0"
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
heapless = "0.9"
# Only for `cobs::max_encoding_length` (buffer sizes); postcard-rpc does the encoding.
cobs = { version = "0.4", default-features = false }

six-dof-platform-common = { path = "../common", features = ["defmt"] }
# David's fork: v0.12.1 + embassy-executor 0.10 support (TODO 1.4).
# Keep this rev identical in common/, firmware/ and web/.
postcard-rpc = { git = "https://github.com/david-boles/postcard-rpc", rev = "301d1384d1612a90fb3a6f3ea188d326f80a574b", features = ["embedded-io-async-0_6-server", "defmt"] }
# postcard-rpc 0.12's embedded-io server is generic over embassy-sync 0.7's
# `RawMutex` trait, so its mutex type parameter must come from 0.7 (we use 0.8 elsewhere).
embassy-sync-07 = { package = "embassy-sync", version = "0.7" }


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2         # prefer slower builds but better debugging experience
lto = 'fat'
opt-level = 's'
